  <text x="78" y="694" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#0f9d58" font-weight="700" text-anchor="start" letter-spacing="1.1">THEN  ·  RPA EXECUTION</text>
  <text x="78" y="722" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0f9d58" font-weight="600" text-anchor="start">Assign</text>
  <text x="90" y="739" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">orderRow = dtOrders.Select("OrderID = " + orderId)</text>
  <text x="78" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0f9d58" font-weight="600" text-anchor="start">If</text>
  <text x="90" y="782" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">orderRow IsNot Nothing</text>
  <text x="78" y="808" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0f9d58" font-weight="600" text-anchor="start">Assign × 3</text>
  <text x="90" y="825" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">orderRowNumber = index + 2 · status · amount</text>
  <text x="78" y="851" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0f9d58" font-weight="600" text-anchor="start">If READ_STATUS</text>
  <text x="90" y="868" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">build the reply string — no write</text>
  <text x="78" y="894" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0f9d58" font-weight="600" text-anchor="start">If PROCESS_REFUND</text>
  <text x="90" y="911" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">eligible? → Write Cell "I" = Refund Initiated</text>
  <text x="90" y="926" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">"J" = N   ·   ref = "RF" + Random(1000, 9999)</text>
  <text x="78" y="952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0f9d58" font-weight="600" text-anchor="start">If UPDATE_ADDRESS</text>
  <text x="90" y="969" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">Write Cell "K" = new_address</text>
  <rect x="78" y="989" width="404" height="96" rx="6" fill="#f6f8fa" stroke="#c9d0da" stroke-width="0"/>
  <text x="94" y="1011" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0f9d58" font-weight="600" text-anchor="start">Then log it — 3 activities</text>
  <text x="94" y="1033" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">1. Read Range (Workbook) · AuditLog → dtLog</text>
  <text x="94" y="1051" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">2. Add Data Row · {timestamp, orderId, intent, …}</text>
  <text x="94" y="1069" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">3. Write Range (Workbook) · AuditLog · A1 · AddHeaders ✔</text>
  <rect x="530" y="668" width="460" height="430" rx="8" fill="#ffffff" stroke="#c9d0da" stroke-width="1.5"/>
  <path d="M538 668 h-4 a4 4 0 0 0 -4 4 v422 a4 4 0 0 0 4 4 h4 z" fill="#d93025"/>
  <rect x="530" y="668" width="5" height="430" fill="#d93025"/>
  <text x="558" y="694" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#d93025" font-weight="700" text-anchor="start" letter-spacing="1.1">ELSE  ·  HUMAN ESCALATION</text>
  <text x="558" y="714" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Covers ESCALATE and NEED_INFO.</text>
  <rect x="558" y="730" width="404" height="96" rx="6" fill="#f6f8fa" stroke="#c9d0da" stroke-width="0"/>
  <text x="574" y="752" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#d93025" font-weight="600" text-anchor="start">Queue the case — 3 activities</text>
  <text x="574" y="774" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">1. Read Range (Workbook) · EscalationQueue → dtLog</text>
  <text x="574" y="792" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">2. Add Data Row · {…, reason, suggestedResolution}</text>
  <text x="574" y="810" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">3. Write Range (Workbook) · EscalationQueue · A1</text>
  <rect x="558" y="842" width="404" height="152" rx="8" fill="#ffffff" stroke="#d93025" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="574" y="866" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#d93025" font-weight="600" text-anchor="start">Message Box — Action Center handoff</text>
  <text x="574" y="884" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">The agent sees a reasoned decision, not a transcript:</text>
  <text x="586" y="906" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#16191d" font-weight="400" text-anchor="start">REASON: SENSITIVITY_CAP</text>
  <text x="586" y="923" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#16191d" font-weight="400" text-anchor="start">Customer said: …</text>
  <text x="586" y="940" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#16191d" font-weight="400" text-anchor="start">Intent: order.refund   Confidence: 0.99</text>
  <text x="586" y="957" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#16191d" font-weight="400" text-anchor="start">Why: Rs 72,990 exceeds the Rs 10,000 cap</text>
  <text x="586" y="974" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#16191d" font-weight="400" text-anchor="start">SUGGESTED RESOLUTION: approve the refund …</text>
  <text x="558" y="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#d93025" font-weight="600" text-anchor="start">Assign</text>
  <text x="614" y="1020" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">replyText = If(route = "NEED_INFO",</text>
  <text x="614" y="1037" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">  followup_question, escalation message)</text>
