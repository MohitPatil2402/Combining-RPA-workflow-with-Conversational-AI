  <text x="308" y="524" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">crmPath → dtOrders   (AddHeaders ✔)</text>
