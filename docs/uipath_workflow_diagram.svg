  <text x="286" y="1175.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
  <text x="308" y="1165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191d" font-weight="600" text-anchor="start">Message Box  —  reply to the customer</text>
  <text x="308" y="1184" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">replyText</text>
  <text x="60" y="1252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">The robot never calls Dialogflow directly. Steps 1–4 are the whole AI integration: plain HTTP, plain JSON, no OAuth inside Studio.</text>
